plugins {
    id 'com.android.application' version '8.9.2'
}

// Derived from the shared journalVersion, so APK upgrades preserve version ordering.
def journalVersionParts = project.version.toString().tokenize('.')
def androidVersionCode = journalVersionParts[0].toInteger() * 10000 +
    journalVersionParts[1].toInteger() * 100 + journalVersionParts[2].toInteger()

android {
    namespace 'ru.javajournal.android'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.javajournal.android'
        minSdk 26
        targetSdk 34
        // Android versionCode must increase monotonically for in-place APK updates.
        // Example: 3.0.0 -> 30000, 3.0.1 -> 30001.
        versionCode androidVersionCode
        versionName project.version.toString()
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    packaging {
        resources.excludes += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':core')
    implementation 'androidx.activity:activity:1.9.3'
}
